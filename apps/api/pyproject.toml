[project]
name = "titan-os"
version = "0.2.0"
description = "Titan-OS: evidence-first sales intelligence and controlled outreach"
requires-python = ">=3.11"
dependencies = [
    # --- API ---
    "fastapi>=0.115,<0.200",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.9",
    # --- persistence ---
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    # --- durability ---
    "temporalio>=1.9,<2",
    # --- http / providers ---
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
    # --- security ---
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9,<3",
    "cryptography>=43.0",
    "cachetools>=5.5",
    "python-dateutil>=2.9",
    "tldextract>=5.1",
    # SPF/DKIM/DMARC verification resolves real TXT records.
    "dnspython>=2.7",
    # Public holidays per country, including movable feasts and the substitute
    # days that follow when one lands on a weekend. A hand-maintained table
    # would go stale every January without anything failing to say so, which is
    # the wrong failure mode for a check that stops mail going out on Christmas.
    "holidays>=0.60,<1",
    # --- observability ---
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-cachetools",
    "types-python-dateutil",
]
otel = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.scripts]
titan = "titan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["titan"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
target-version = "py311"
line-length = 90
src = ["titan", "tests"]
extend-exclude = ["app"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # import sorting
    "UP",                # pyupgrade
    "B",                 # bugbear
    "S",                 # bandit
    "ASYNC",             # async correctness
    "DTZ",               # naive-datetime ban (gap analysis M-04)
    "T20",               # no stray print()
    "RUF",
]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "E501",   # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "DTZ001", "DTZ005"]
"titan/db/migrations/**" = ["I001", "E402"]
"titan/cli.py" = ["T20"]
"titan/seed.py" = ["T20"]  # operator script; printing is the interface
"titan/provision_markets.py" = ["T20"]  # likewise
"titan/provision_smartlead.py" = ["T20"]  # likewise
"titan/provision_senders.py" = ["T20"]  # likewise
"titan/backfill_timezones.py" = ["T20"]  # likewise

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
# Strict on the new production core. The legacy app/ package is excluded until
# it is fully superseded; see docs/audits/PRODUCTION-GAP-ANALYSIS.md M-17.
files = ["titan"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "titan.db.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hard backstop. A workflow-task failure inside a Temporal workflow is
# retried forever by design, which once turned a single broken test into a
# CI job that hung until the runner timed out. No test may exceed this.
timeout = 300
timeout_method = "thread"
# --strict-config turns a missing pytest-timeout into an immediate error
# rather than an ignored `timeout` key and a silently unbounded suite.
addopts = "--strict-config --strict-markers"
markers = [
    "integration: requires a live PostgreSQL",
    "browser: requires the browser evidence worker",
    "live_provider: makes a real credentialled provider call",
]

[tool.coverage.run]
source = ["titan"]
branch = true
omit = ["titan/db/migrations/*", "titan/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
