[project]
name = "titan-api"
version = "0.1.0"
description = "FastAPI Backend for TITAN"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cachetools>=5.3.0",
    "httpx>=0.24.0",
    "prisma>=0.11.0",
    "titan-contracts",
    "langchain",
    "langgraph",
    "temporalio",
    "cryptography",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "prometheus-client",
    "slowapi"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "black",
    "mypy"
]

[tool.uv.sources]
titan-contracts = { path = "../../packages/contracts" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
