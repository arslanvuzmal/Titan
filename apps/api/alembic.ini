[alembic]
script_location = titan/db/migrations
prepend_sys_path = .
# Timestamped, ordered revision filenames so history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
# sqlalchemy.url is intentionally absent: env.py reads TITAN_DATABASE_URL via
# titan.config so there is exactly one source of truth for the DSN, and no
# credential can be committed in this file.

[post_write_hooks]
# Deliberately empty. A post-write hook here resolves `ruff` differently on
# Windows (ruff.exe) than on Linux and fails the whole `alembic revision`
# command when it cannot be found -- turning a formatting nicety into a broken
# developer workflow. Formatting is enforced once, centrally, by `ruff format
# --check` in CI, which covers migrations along with everything else.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
