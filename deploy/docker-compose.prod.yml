# Self-hosted Titan-OS.
#
# This is the single-VM path. The managed path (Vercel for the dashboard,
# Railway for everything else) is in deploy/railway/README.md; the two are
# alternatives, not layers.
#
# What the previous version of this file got wrong, recorded because a
# deployment file that looks plausible is worse than one that is obviously
# incomplete:
#
#   * It ran none of the three workers. The API and dashboard came up, the CRM
#     worked, and nothing was ever researched or sent -- a stack that looks
#     healthy while doing no work at all.
#   * postgres:15-alpine, with no pgvector. The schema requires the extension
#     and everything else is tested on 16.
#   * Temporal shared the application database, so a Temporal schema upgrade
#     reached tenant data.
#   * POSTGRES_PASSWORD defaulted to a literal committed in this file. A
#     production compose must refuse to start rather than come up on a
#     published password.
#
# Required variables have no defaults on purpose: `${VAR:?message}` aborts with
# that message instead of starting something half-configured.

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # 443 is deliberately NOT published while there is no certificate.
    #
    # Publishing it bound docker-proxy to the port with nothing behind it, so a
    # browser opening https://<host> completed the TCP handshake and then waited
    # for a TLS server that does not exist. That is worse than closed: a refused
    # connection makes a browser fall back to http:// immediately, whereas this
    # looked like a live server and timed out as "site can't be reached" -- and
    # Chrome tries https first, so the CRM appeared to be down while it was
    # serving perfectly well on 80.
    #
    # Add it back in the same change that adds a `listen 443 ssl` block and a
    # real certificate, never before.
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Written by certbot on the host, read by nginx to answer the HTTP-01
      # challenge. Empty until the first issuance.
      - ./nginx/acme:/var/www/acme:ro
      # The 443 server block, dropped in by deploy/tls/enable-tls.sh once a
      # certificate exists. Empty means no TLS listener, which is deliberate.
      - ./nginx/tls:/etc/nginx/tls:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [titan_network]

  # One-shot. Everything else waits for it, so no process opens a connection
  # against a schema it does not understand.
  migrate:
    image: ${TITAN_API_IMAGE:?set TITAN_API_IMAGE, e.g. ghcr.io/arslanvuzmal/titan-api:sha-abc1234}
    restart: "no"
    env_file: [../.env]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [titan_network]

  api:
    image: ${TITAN_API_IMAGE:?set TITAN_API_IMAGE}
    restart: unless-stopped
    env_file: [../.env]
    # The mailbox passwords. `.env` sets TITAN_MAILBOX_FILE to a path inside
    # this mount, so without it the file simply is not there and every send
    # fails to authenticate -- on a host nobody is watching.
    volumes:
      - ../secrets:/run/secrets:ro
    # Not published to the host: nginx terminates TLS and is the only ingress.
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [titan_network]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Leases outbox rows and talks to the email provider. The only component
  # that holds a delivery credential.
  outbox-worker:
    image: ${TITAN_API_IMAGE:?set TITAN_API_IMAGE}
    restart: unless-stopped
    env_file: [../.env]
    # Which host this is, for the sending claim. Declared here as well as in
    # .env so the stack refuses to start without it: a sender that cannot prove
    # which estate it belongs to fails closed and sends nothing, and finding
    # that out from a silent day is worse than finding it out from compose.
    environment:
      TITAN_SENDER_HOST_ID: ${TITAN_SENDER_HOST_ID:?set TITAN_SENDER_HOST_ID, e.g. vps-hetzner-cx33}
      TITAN_SENDER_HOST_LABEL: ${TITAN_SENDER_HOST_LABEL:-}
    command: ["python", "-m", "titan.workers.outbox"]
    # The mailbox passwords. `.env` sets TITAN_MAILBOX_FILE to a path inside
    # this mount, so without it the file simply is not there and every send
    # fails to authenticate -- on a host nobody is watching.
    volumes:
      - ../secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [titan_network]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # The API image's HEALTHCHECK curls :8000; a worker serves no HTTP, so
      # it would be permanently unhealthy and restart-looped. `preflight` is
      # also wrong here -- it exits non-zero whenever sending is blocked,
      # which is the normal and desired state in research_only mode. This
      # checks the one dependency the worker genuinely needs.
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['TITAN_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Reads every mailbox and feeds replies and bounces back into the system.
  #
  # **Absent from this file until 16 September**, which would have been an
  # expensive thing to discover after a migration. Without it: no reply is ever
  # collected, so the instant alert never fires and the CRM stays empty; and no
  # bounce is ever ingested, so `suppression_entries` stops growing and the
  # address-history layer added on the 14th learns nothing. The estate would
  # have looked healthy -- sending, crawling, drafting -- while quietly losing
  # both halves of the feedback loop.
  inbound-worker:
    image: ${TITAN_API_IMAGE:?set TITAN_API_IMAGE}
    # on-failure, not unless-stopped. The worker exits zero when IMAP is not
    # configured, and `unless-stopped` restarts a container whatever its exit
    # code -- which turns a clean "nothing to do" into a permanent crash loop
    # that makes the whole stack look unhealthy.
    restart: on-failure
    env_file: [../.env]
    command: ["python", "-m", "titan.workers.inbound"]
    # The mailbox passwords. `.env` sets TITAN_MAILBOX_FILE to a path inside
    # this mount, so without it the file simply is not there and every send
    # fails to authenticate -- on a host nobody is watching.
    volumes:
      - ../secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [titan_network]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['TITAN_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  temporal-worker:
    image: ${TITAN_API_IMAGE:?set TITAN_API_IMAGE}
    restart: unless-stopped
    env_file: [../.env]
    command: ["python", "-m", "titan.workers.temporal_worker"]
    # DailyReportWorkflow and the other operator mail run here, and
    # mail_the_operator() reads TITAN_MAILBOX_FILE. Without this mount the
    # worker came up healthy and threw MailboxConfigError once an hour
    # instead: a stack that looks fine while the operator hears nothing.
    volumes:
      - ../secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    networks: [titan_network]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['TITAN_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  # The CRM. nginx has declared a `web:3000` upstream since the first version
  # of this file, but the service itself was never here -- so nginx died at
  # startup on "host not found in upstream", port 80 served nothing, and the
  # portal could only be reached by running the stack on a laptop.
  #
  # No env_file: the dashboard reaches the API from the browser, so it needs no
  # database or mail credentials of its own.
  #
  # NEXT_PUBLIC_API_URL has to be supplied twice, in two different ways, and
  # that is not redundancy. The browser bundle gets its copy compiled in at
  # build time (`--build-arg`, see apps/web/Dockerfile); setting it only here
  # would leave the compiled-in value untouched, which is how the dashboard once
  # shipped calling port 8000 while the API was published on 8010. The runtime
  # value below is the one server-side rendering reads.
  web:
    image: ${TITAN_WEB_IMAGE:?set TITAN_WEB_IMAGE, e.g. titan-web:local}
    restart: unless-stopped
    environment:
      # Origin only, no path: the client appends /api/v1 itself. Read here at
      # runtime by server-side rendering; the browser bundle carries its own
      # copy, compiled in at build time -- see apps/web/Dockerfile.
      NEXT_PUBLIC_API_URL: ${TITAN_PUBLIC_ORIGIN:?set TITAN_PUBLIC_ORIGIN, e.g. http://168.119.161.220}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose: ["3000"]
    depends_on: [api]
    networks: [titan_network]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # The only component that fetches attacker-controlled URLs, and the only one
  # with no database, email, or model credentials. `env_file` is deliberately
  # absent -- a full browser escape must yield nothing worth having.
  browser-worker:
    image: ${TITAN_BROWSER_WORKER_IMAGE:?set TITAN_BROWSER_WORKER_IMAGE}
    restart: unless-stopped
    # Docker's tini as PID 1, whose only job is to reap orphaned children.
    #
    # Without it `node` is PID 1. Chromium spawns child processes, and when
    # their immediate parent exits the kernel re-parents them to PID 1 --
    # which is supposed to wait() on them. node does not, because reaping
    # strangers is an init's job and node is not an init. So every crawl left
    # zombies behind: they hold a PID each and are never released.
    #
    # Measured on 24 September: 9,151 zombie headless_shell processes against
    # a cgroup ceiling of 9,255. Every fork() in the container was returning
    # EAGAIN, so no browser could launch, every crawl failed, every research
    # run failed, no drafts were written, and sending fell from 100 a day to
    # 2 and then 0 over the following two days. The container's own health
    # check had been failing for 10,003 consecutive attempts, because `docker
    # exec` needs to fork too.
    #
    # Restarting the container clears the zombies and hides this for about
    # five days. This line is what stops it coming back.
    init: true
    environment:
      BROWSER_WORKER_PORT: "8800"
      BROWSER_WORKER_TOKEN: ${TITAN_BROWSER_WORKER_TOKEN:?set TITAN_BROWSER_WORKER_TOKEN}
    expose: ["8800"]
    networks: [titan_network]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8800/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    # pgvector on 16, matching what the schema and the test suite assume.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-titan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [titan_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal's own database, separate from the application's so a Temporal
  # schema upgrade cannot touch tenant data.
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    networks: [titan_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [titan_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.22.4
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
    depends_on:
      temporal-postgres:
        condition: service_healthy
    expose: ["7233"]
    networks: [titan_network]
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  titan_network:
    driver: bridge

volumes:
  postgres_data:
  temporal_postgres_data:
  redis_data:
