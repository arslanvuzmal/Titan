user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Enable Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # No `upstream` blocks, on purpose.
    #
    # nginx resolves a hostname written literally in `proxy_pass` -- or in an
    # `upstream` block -- exactly once, at startup, and refuses to start at all
    # if it does not resolve. That cost this estate twice on 16-17 September:
    #
    #   * The `web` service was missing from the production compose file, so
    #     nginx died on `host not found in upstream "web:3000"` every 60s and
    #     took `/api/` down with it -- an upstream that was healthy throughout.
    #     A missing dashboard cost all ingress.
    #   * Once `web` existed, the first ordinary `up -d` recreated `api` a few
    #     seconds after nginx had started, and nginx went on serving 502
    #     against the address `api` no longer held until it was bounced by hand.
    #
    # The second is the one that matters long-term: it happens on every deploy,
    # not only when a service is missing. So every upstream now resolves through
    # a variable, which defers the lookup to request time.

    # TLS lives here, in a file that exists only once a certificate does.
    # An `include` whose glob matches nothing is not an error, so this is inert
    # until deploy/tls/enable-tls.sh has something real to install -- which is
    # what keeps 443 honestly closed rather than open and silent.
    include /etc/nginx/tls/*.conf;

    server {
        # `default_server` is load-bearing. nginx picks the *first* server on a
        # port as default when no server_name matches, and the TLS file is
        # included above this block -- so once it exists, its `server_name
        # <domain>` redirect-to-https block was being chosen for requests to the
        # bare IP, and the plain-HTTP escape hatch started 301ing to a name that
        # may be exactly what is broken. Claiming default here keeps the IP on
        # http whatever else is included.
        listen 80 default_server;
        server_name localhost _;

        # Docker's embedded DNS. `valid=10s` re-resolves shortly after a
        # container is recreated instead of holding a dead address until nginx
        # is restarted by hand.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://api:8000;
        set $web_upstream http://web:3000;

        # `$request_uri` is appended explicitly below, and it is not optional:
        # with a variable in `proxy_pass`, nginx stops passing the client's URI
        # implicitly. Without it every proxied path collapses to `/` and the
        # query string is dropped -- which fails quietly, as a dashboard that
        # loads but ignores `?tab=`.

        # ACME HTTP-01. Served before anything else and never redirected,
        # because Let's Encrypt fetches it over plain HTTP by definition -- a
        # redirect to a certificate that does not exist yet cannot be followed.
        # `^~` stops a later regex location stealing it.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type "text/plain";
            access_log off;
        }

        # Add security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Route API requests
        location /api/ {
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route WebSockets for API
        location /ws/ {
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Route all other requests to the Next.js frontend
        location / {
            proxy_pass $web_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Next.js Hot Module Reloading for local development (if ever mapped)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
