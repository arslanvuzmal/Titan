# Titan-OS local development stack.
#
# Replaces the pre-0.2 compose file, which defined only postgres/redis/temporal
# and therefore never delivered a single environment variable to the API or the
# workers (gap analysis C-13, M-12). Every service that needs a setting now
# receives it explicitly.
#
#   docker compose up -d
#
# Production sending is OFF here and must stay off: enabling it is a deliberate
# operator action, documented in docs/PRODUCTION-ENABLEMENT-CHECKLIST.md.

name: titan

x-titan-env: &titan-env
  TITAN_ENVIRONMENT: ${TITAN_ENVIRONMENT:-local}
  TITAN_LOG_LEVEL: ${TITAN_LOG_LEVEL:-INFO}
  TITAN_DATABASE_URL: postgresql+psycopg://titan:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/titan
  TITAN_TEMPORAL_HOST: temporal:7233
  TITAN_TEMPORAL_NAMESPACE: ${TITAN_TEMPORAL_NAMESPACE:-default}
  TITAN_BROWSER_WORKER_URL: http://browser-worker:8800
  TITAN_BROWSER_WORKER_TOKEN: ${TITAN_BROWSER_WORKER_TOKEN:-}
  TITAN_FRONTEND_URL: ${TITAN_FRONTEND_URL:-http://localhost:3000}
  # --- the global kill switch. Never default this to true. ---
  TITAN_PRODUCTION_SENDING_ENABLED: ${TITAN_PRODUCTION_SENDING_ENABLED:-false}
  TITAN_EMAIL_PROVIDER: ${TITAN_EMAIL_PROVIDER:-mock}
  TITAN_EMAIL_AUTH_PREFLIGHT_ACKNOWLEDGED: ${TITAN_EMAIL_AUTH_PREFLIGHT_ACKNOWLEDGED:-false}
  TITAN_RESEND_API_KEY: ${TITAN_RESEND_API_KEY:-}
  TITAN_RESEND_WEBHOOK_SECRET: ${TITAN_RESEND_WEBHOOK_SECRET:-}
  TITAN_SENDER_MAILING_ADDRESS: ${TITAN_SENDER_MAILING_ADDRESS:-}
  # --- smartlead ---
  # These were absent from this file entirely, so no container could reach
  # Smartlead: the provider, the mailbox ramp and the delivery-event poller all
  # fell through to "no Smartlead API key is configured" and did nothing. They
  # failed soft and said so, which is why it read as quiet rather than broken.
  #
  # The key alone is read-mostly -- it is what lets the poller collect delivery
  # outcomes. The two switches below are what allow *writing*, and they keep the
  # same discipline as TITAN_PRODUCTION_SENDING_ENABLED above: never defaulted
  # to true, so a fresh checkout cannot push leads or send on its own.
  TITAN_SMARTLEAD_API_KEY: ${TITAN_SMARTLEAD_API_KEY:-}
  TITAN_SMARTLEAD_BASE_URL: ${TITAN_SMARTLEAD_BASE_URL:-https://server.smartlead.ai/api/v1}
  TITAN_SMARTLEAD_CAMPAIGN_ID: ${TITAN_SMARTLEAD_CAMPAIGN_ID:-}
  TITAN_SMARTLEAD_SANDBOX_CAMPAIGN_ID: ${TITAN_SMARTLEAD_SANDBOX_CAMPAIGN_ID:-}
  TITAN_SMARTLEAD_TIMEOUT_SECONDS: ${TITAN_SMARTLEAD_TIMEOUT_SECONDS:-30}
  TITAN_SMARTLEAD_WEBHOOK_SECRET: ${TITAN_SMARTLEAD_WEBHOOK_SECRET:-}
  TITAN_SMARTLEAD_PRODUCTION_ENABLED: ${TITAN_SMARTLEAD_PRODUCTION_ENABLED:-false}
  TITAN_SMARTLEAD_IMPORT_ENABLED: ${TITAN_SMARTLEAD_IMPORT_ENABLED:-false}
  # --- reply collection (inbound-worker) ---
  # No kill switch here, unlike sending. Reading replies is how unsubscribes,
  # complaints and bounces are honoured, so the safe default is *on* wherever
  # credentials exist -- the dangerous state is a system that mails people and
  # cannot hear them answer.
  TITAN_IMAP_HOST: ${TITAN_IMAP_HOST:-}
  TITAN_IMAP_PORT: ${TITAN_IMAP_PORT:-993}
  TITAN_IMAP_USERNAME: ${TITAN_IMAP_USERNAME:-}
  TITAN_IMAP_PASSWORD: ${TITAN_IMAP_PASSWORD:-}
  TITAN_IMAP_SECURITY: ${TITAN_IMAP_SECURITY:-ssl}
  TITAN_IMAP_FOLDER: ${TITAN_IMAP_FOLDER:-INBOX}
  TITAN_IMAP_POLL_SECONDS: ${TITAN_IMAP_POLL_SECONDS:-60}
  TITAN_IMAP_WORKSPACE_ID: ${TITAN_IMAP_WORKSPACE_ID:-}
  # Optional chat webhook for operator alerts. Every notification is written to
  # the tasks table regardless; this only decides whether one also arrives
  # somewhere noisier. Unset degrades the channel, never the record.
  TITAN_OPERATOR_WEBHOOK_URL: ${TITAN_OPERATOR_WEBHOOK_URL:-}
  # --- discovery ---
  TITAN_GOOGLE_PLACES_API_KEY: ${TITAN_GOOGLE_PLACES_API_KEY:-}
  TITAN_AGENT_REACH_API_KEY: ${TITAN_AGENT_REACH_API_KEY:-}
  TITAN_AGENT_REACH_BASE_URL: ${TITAN_AGENT_REACH_BASE_URL:-}
  # --- models ---
  TITAN_NVIDIA_API_KEY: ${TITAN_NVIDIA_API_KEY:-}
  TITAN_GEMINI_API_KEY: ${TITAN_GEMINI_API_KEY:-}
  TITAN_OPENROUTER_API_KEY: ${TITAN_OPENROUTER_API_KEY:-}
  TITAN_CLOUDFLARE_ACCOUNT_ID: ${TITAN_CLOUDFLARE_ACCOUNT_ID:-}
  TITAN_CLOUDFLARE_GATEWAY_ID: ${TITAN_CLOUDFLARE_GATEWAY_ID:-}
  TITAN_CLOUDFLARE_API_TOKEN: ${TITAN_CLOUDFLARE_API_TOKEN:-}
  # --- identity ---
  TITAN_AUTH_MODE: ${TITAN_AUTH_MODE:-local}
  TITAN_LOCAL_JWT_SECRET: ${TITAN_LOCAL_JWT_SECRET:-dev-only-not-for-production}
  TITAN_CLERK_ISSUER_URL: ${TITAN_CLERK_ISSUER_URL:-}
  # --- observability ---
  TITAN_OTEL_EXPORTER_OTLP_ENDPOINT: ${TITAN_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  TITAN_OTEL_TRACES_ENABLED: ${TITAN_OTEL_TRACES_ENABLED:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_dev_password}
      POSTGRES_DB: titan
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    command: >
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Temporal keeps its own database. Sharing the application database, as the
  # pre-0.2 compose file did, couples two very different write patterns and
  # makes an application restore also roll back workflow history.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev_password}
      POSTGRES_DB: temporal
    volumes: [temporal_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev_password}
      POSTGRES_SEEDS: temporal-postgres
    ports: ["${TEMPORAL_HOST_PORT:-7233}:7233"]
    depends_on:
      temporal-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # The Web UI is a SEPARATE image. The pre-0.2 compose file published port
  # 8233 on the auto-setup container, which serves gRPC only -- so the UI URL
  # in the old README could never have worked.
  temporal-ui:
    image: temporalio/ui:2.32.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["${TEMPORAL_UI_HOST_PORT:-8233}:8080"]
    depends_on: [temporal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *titan-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *titan-env
    command: ["uvicorn", "titan.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${API_HOST_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # Registers LeadResearchWorkflow and its activities on the titan-research
  # queue. The pre-0.2 repository defined workflows and registered none of them,
  # so nothing could execute; this service is that missing registration.
  temporal-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *titan-env
    command: ["python", "-m", "titan.workers.temporal_worker"]
    healthcheck:
      # The API image's HEALTHCHECK curls :8000; a worker serves no HTTP, so it
      # would be permanently unhealthy and restart-looped. This checks the one
      # dependency the worker genuinely needs.
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['TITAN_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # The only service holding an email provider credential.
  outbox-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *titan-env
    command: ["python", "-m", "titan.workers.outbox"]
    healthcheck:
      # The API image's HEALTHCHECK curls :8000; a worker serves no HTTP, so it
      # would be permanently unhealthy and restart-looped. This checks the one
      # dependency the worker genuinely needs.
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['TITAN_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # Reads the outreach mailbox and feeds replies to the ingest rules. Runs under
  # the same profile as the outbox worker but is a separate process on purpose:
  # this one holds a mailbox password and never sends, that one holds a provider
  # client and never reads. Neither can do the other's job by accident.
  #
  # Starts only when TITAN_IMAP_HOST is set -- it refuses to boot without
  # credentials rather than idling and looking healthy while reading nothing.
  inbound-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *titan-env
    command: ["python", "-m", "titan.workers.inbound"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['TITAN_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: on-failure
    # on-failure, not unless-stopped. The worker exits zero when IMAP is
    # not configured, and `unless-stopped` restarts a container whatever
    # its exit code -- which turned a clean 'nothing to do' into a
    # permanent crash loop that made the whole stack look unhealthy.

  # Deliberately receives NO database, email, or model credentials. It is the
  # only service that fetches attacker-controlled URLs, so its blast radius is
  # limited to "can make outbound HTTP requests".
  browser-worker:
    build: {context: apps/browser-worker, dockerfile: Dockerfile}
    environment:
      BROWSER_WORKER_PORT: "8800"
      BROWSER_WORKER_TOKEN: ${TITAN_BROWSER_WORKER_TOKEN:-}
      BROWSER_WORKER_CONCURRENCY: ${BROWSER_WORKER_CONCURRENCY:-2}
    ports: ["${BROWSER_WORKER_HOST_PORT:-8800}:8800"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8800/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: [no-new-privileges:true]
    # Chromium needs more than the 64MB default shared memory segment.
    shm_size: 1gb
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Passed as a build argument, not only as an environment variable:
      # NEXT_PUBLIC_* is compiled into the browser bundle, so a runtime value
      # is never seen by the page that needs it. Defaults to the API's own host
      # port so the two cannot drift -- they had, and the dashboard called 8000
      # while the API listened on 8010.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8000}}
    environment:
      # Kept for server-side rendering, which reads it at runtime. Origin only:
      # the client appends /api/v1 itself.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8000}}
      NODE_ENV: production
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_data:
  redis_data:
