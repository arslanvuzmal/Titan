# ColdOps local development stack.
#
# Replaces the pre-0.2 compose file, which defined only postgres/redis/temporal
# and therefore never delivered a single environment variable to the API or the
# workers (gap analysis C-13, M-12). Every service that needs a setting now
# receives it explicitly.
#
#   docker compose up -d
#
# Production sending is OFF here and must stay off: enabling it is a deliberate
# operator action, documented in docs/PRODUCTION-ENABLEMENT-CHECKLIST.md.

name: titan

x-coldops-env: &coldops-env
  COLDOPS_ENVIRONMENT: ${COLDOPS_ENVIRONMENT:-local}
  COLDOPS_LOG_LEVEL: ${COLDOPS_LOG_LEVEL:-INFO}
  COLDOPS_DATABASE_URL: postgresql+psycopg://titan:${POSTGRES_PASSWORD:-titan_dev_password}@postgres:5432/titan
  COLDOPS_TEMPORAL_HOST: temporal:7233
  COLDOPS_TEMPORAL_NAMESPACE: ${COLDOPS_TEMPORAL_NAMESPACE:-default}
  COLDOPS_BROWSER_WORKER_URL: http://browser-worker:8800
  COLDOPS_BROWSER_WORKER_TOKEN: ${COLDOPS_BROWSER_WORKER_TOKEN:-}
  # Same variable, same default as the browser worker's own
  # BROWSER_WORKER_CONCURRENCY below, so the callers cannot start more crawls
  # than there are lanes to run them. If you raise one, raise both.
  COLDOPS_BROWSER_WORKER_CONCURRENCY: ${BROWSER_WORKER_CONCURRENCY:-4}
  COLDOPS_FRONTEND_URL: ${COLDOPS_FRONTEND_URL:-http://localhost:3000}
  # --- the global kill switch. Never default this to true. ---
  COLDOPS_PRODUCTION_SENDING_ENABLED: ${COLDOPS_PRODUCTION_SENDING_ENABLED:-false}
  COLDOPS_EMAIL_PROVIDER: ${COLDOPS_EMAIL_PROVIDER:-mock}
  COLDOPS_EMAIL_AUTH_PREFLIGHT_ACKNOWLEDGED: ${COLDOPS_EMAIL_AUTH_PREFLIGHT_ACKNOWLEDGED:-false}
  COLDOPS_RESEND_API_KEY: ${COLDOPS_RESEND_API_KEY:-}
  COLDOPS_RESEND_WEBHOOK_SECRET: ${COLDOPS_RESEND_WEBHOOK_SECRET:-}
  COLDOPS_SENDER_MAILING_ADDRESS: ${COLDOPS_SENDER_MAILING_ADDRESS:-}
  # --- smartlead ---
  # These were absent from this file entirely, so no container could reach
  # Smartlead: the provider, the mailbox ramp and the delivery-event poller all
  # fell through to "no Smartlead API key is configured" and did nothing. They
  # failed soft and said so, which is why it read as quiet rather than broken.
  #
  # The key alone is read-mostly -- it is what lets the poller collect delivery
  # outcomes. The two switches below are what allow *writing*, and they keep the
  # same discipline as COLDOPS_PRODUCTION_SENDING_ENABLED above: never defaulted
  # to true, so a fresh checkout cannot push leads or send on its own.
  COLDOPS_SMARTLEAD_API_KEY: ${COLDOPS_SMARTLEAD_API_KEY:-}
  COLDOPS_INSTANTLY_API_KEY: ${COLDOPS_INSTANTLY_API_KEY:-}
  COLDOPS_INSTANTLY_CAMPAIGN_ID: ${COLDOPS_INSTANTLY_CAMPAIGN_ID:-}
  COLDOPS_INSTANTLY_WEBHOOK_SECRET: ${COLDOPS_INSTANTLY_WEBHOOK_SECRET:-}
  COLDOPS_SMARTLEAD_BASE_URL: ${COLDOPS_SMARTLEAD_BASE_URL:-https://server.smartlead.ai/api/v1}
  COLDOPS_SMARTLEAD_CAMPAIGN_ID: ${COLDOPS_SMARTLEAD_CAMPAIGN_ID:-}
  COLDOPS_SMARTLEAD_SANDBOX_CAMPAIGN_ID: ${COLDOPS_SMARTLEAD_SANDBOX_CAMPAIGN_ID:-}
  COLDOPS_SMARTLEAD_TIMEOUT_SECONDS: ${COLDOPS_SMARTLEAD_TIMEOUT_SECONDS:-30}
  COLDOPS_SMARTLEAD_WEBHOOK_SECRET: ${COLDOPS_SMARTLEAD_WEBHOOK_SECRET:-}
  COLDOPS_SMARTLEAD_PRODUCTION_ENABLED: ${COLDOPS_SMARTLEAD_PRODUCTION_ENABLED:-false}
  COLDOPS_SMARTLEAD_IMPORT_ENABLED: ${COLDOPS_SMARTLEAD_IMPORT_ENABLED:-false}
  # --- direct SMTP sending ---
  # These were defined in config.py and never passed through here, so setting
  # any of them in .env changed nothing and the smtp provider could not be
  # reached at all. Same class of gap as the Smartlead env block.
  COLDOPS_SMTP_HOST: ${COLDOPS_SMTP_HOST:-}
  COLDOPS_SMTP_PORT: ${COLDOPS_SMTP_PORT:-587}
  COLDOPS_SMTP_USERNAME: ${COLDOPS_SMTP_USERNAME:-}
  COLDOPS_SMTP_PASSWORD: ${COLDOPS_SMTP_PASSWORD:-}
  COLDOPS_SMTP_SECURITY: ${COLDOPS_SMTP_SECURITY:-ssl}
  COLDOPS_SMTP_TIMEOUT_SECONDS: ${COLDOPS_SMTP_TIMEOUT_SECONDS:-30}
  # One credential per sending mailbox, for COLDOPS_EMAIL_PROVIDER=smtp_pool.
  # A path, not the credentials themselves: the pool holds one password per
  # address and a password put here would appear in `docker compose config`,
  # in `docker inspect`, and in every screenshot of either. The file is
  # mounted read-only into the three services that genuinely need it and
  # into nothing else. See coldops.delivery.mailboxes.
  COLDOPS_MAILBOX_FILE: ${COLDOPS_MAILBOX_FILE:-}
  # Daily warm-up traffic with partner mailboxes on Gmail/Outlook. See
  # coldops.delivery.warmup.round_pool; partners must not be placement seeds.
  COLDOPS_WARMUP_ENABLED: ${COLDOPS_WARMUP_ENABLED:-false}
  COLDOPS_WARMUP_PARTNER_FILE: ${COLDOPS_WARMUP_PARTNER_FILE:-}
  # Evidence pages: the public origin they are served from, and the key that
  # signs their links. Either unset and no message carries an evidence link.
  COLDOPS_EVIDENCE_BASE_URL: ${COLDOPS_EVIDENCE_BASE_URL:-}
  COLDOPS_EVIDENCE_SECRET: ${COLDOPS_EVIDENCE_SECRET:-}
  # --- mailbox verification ---
  # ColdOps's own probe. Same class of gap as the SMTP block above: the
  # settings existed and nothing passed them in, so a container read the
  # default 'null' and reported a clean sweep over addresses it had never
  # checked. See coldops/intelligence/smtp_probe.py.
  COLDOPS_MAILBOX_VERIFIER: ${COLDOPS_MAILBOX_VERIFIER:-null}
  COLDOPS_SMTP_PROBE_HELO: ${COLDOPS_SMTP_PROBE_HELO:-}
  COLDOPS_SMTP_PROBE_MAIL_FROM: ${COLDOPS_SMTP_PROBE_MAIL_FROM:-}
  COLDOPS_SMTP_PROBE_TIMEOUT_SECONDS: ${COLDOPS_SMTP_PROBE_TIMEOUT_SECONDS:-12}
  COLDOPS_SMTP_PROBE_CONCURRENCY: ${COLDOPS_SMTP_PROBE_CONCURRENCY:-4}
  # --- reply collection (inbound-worker) ---
  # No kill switch here, unlike sending. Reading replies is how unsubscribes,
  # complaints and bounces are honoured, so the safe default is *on* wherever
  # credentials exist -- the dangerous state is a system that mails people and
  # cannot hear them answer.
  # Shared with the unsubscribe endpoint on the portfolio, which verifies
  # the signature on every opt-out link and guards the list it exposes.
  COLDOPS_UNSUBSCRIBE_SECRET: ${COLDOPS_UNSUBSCRIBE_SECRET:-}
  COLDOPS_IMAP_HOST: ${COLDOPS_IMAP_HOST:-}
  COLDOPS_IMAP_PORT: ${COLDOPS_IMAP_PORT:-993}
  COLDOPS_IMAP_USERNAME: ${COLDOPS_IMAP_USERNAME:-}
  COLDOPS_IMAP_PASSWORD: ${COLDOPS_IMAP_PASSWORD:-}
  COLDOPS_IMAP_SECURITY: ${COLDOPS_IMAP_SECURITY:-ssl}
  COLDOPS_IMAP_FOLDER: ${COLDOPS_IMAP_FOLDER:-INBOX}
  COLDOPS_IMAP_POLL_SECONDS: ${COLDOPS_IMAP_POLL_SECONDS:-60}
  COLDOPS_IMAP_WORKSPACE_ID: ${COLDOPS_IMAP_WORKSPACE_ID:-}
  # Optional chat webhook for operator alerts. Every notification is written to
  # the tasks table regardless; this only decides whether one also arrives
  # somewhere noisier. Unset degrades the channel, never the record.
  COLDOPS_OPERATOR_WEBHOOK_URL: ${COLDOPS_OPERATOR_WEBHOOK_URL:-}
  # The operator's own address, so mail *from* it is not read as a prospect
  # reply. A delivery test sent from the operator's Gmail threaded onto a real
  # lead, classified HUMAN, and retired it -- REPLIED is terminal, so that
  # dental practice would never have been written to again.
  #
  # The same omission as COLDOPS_MODEL_REWRITES_ENABLED below: the setting was
  # added to .env and to the code, and this list was not updated, so every
  # container read the default of None and the guard was half-installed.
  COLDOPS_OPERATOR_EMAIL: ${COLDOPS_OPERATOR_EMAIL:-}
  # --- discovery ---
  COLDOPS_GOOGLE_PLACES_API_KEY: ${COLDOPS_GOOGLE_PLACES_API_KEY:-}
  COLDOPS_AGENT_REACH_API_KEY: ${COLDOPS_AGENT_REACH_API_KEY:-}
  COLDOPS_AGENT_REACH_BASE_URL: ${COLDOPS_AGENT_REACH_BASE_URL:-}
  # --- models ---
  COLDOPS_NVIDIA_API_KEY: ${COLDOPS_NVIDIA_API_KEY:-}
  COLDOPS_GEMINI_API_KEY: ${COLDOPS_GEMINI_API_KEY:-}
  COLDOPS_OPENROUTER_API_KEY: ${COLDOPS_OPENROUTER_API_KEY:-}
  COLDOPS_CLOUDFLARE_ACCOUNT_ID: ${COLDOPS_CLOUDFLARE_ACCOUNT_ID:-}
  COLDOPS_CLOUDFLARE_GATEWAY_ID: ${COLDOPS_CLOUDFLARE_GATEWAY_ID:-}
  COLDOPS_CLOUDFLARE_API_TOKEN: ${COLDOPS_CLOUDFLARE_API_TOKEN:-}
  # Whether Gemini phrases the message. The keys above were passed and this was
  # not, so `COLDOPS_MODEL_REWRITES_ENABLED=true` sat in .env while every
  # container read the code default of false -- and every email ColdOps has ever
  # sent was the deterministic template text. The rewriter never ran once.
  COLDOPS_MODEL_REWRITES_ENABLED: ${COLDOPS_MODEL_REWRITES_ENABLED:-false}
  # Model IDs are configuration. Pinned routes that leave a provider's
  # catalogue must be changeable without a rebuild; `coldops validate-models`
  # checks them against the live catalogue.
  COLDOPS_MODEL_ROUTE_EXTRACTION: ${COLDOPS_MODEL_ROUTE_EXTRACTION:-nvidia:nvidia/nemotron-3-super-120b-a12b}
  COLDOPS_MODEL_ROUTE_RESEARCH: ${COLDOPS_MODEL_ROUTE_RESEARCH:-nvidia:nvidia/nemotron-3-super-120b-a12b}
  COLDOPS_MODEL_ROUTE_VERIFICATION: ${COLDOPS_MODEL_ROUTE_VERIFICATION:-nvidia:nvidia/nemotron-3-super-120b-a12b}
  COLDOPS_MODEL_ROUTE_MESSAGE: ${COLDOPS_MODEL_ROUTE_MESSAGE:-openrouter:nvidia/nemotron-3-super-120b-a12b:free}
  COLDOPS_MODEL_ROUTE_PREMIUM: ${COLDOPS_MODEL_ROUTE_PREMIUM:-cloudflare:workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast}
  # --- message content ---
  # Real previous projects, cited in the credibility paragraph. Unset is a
  # working state: the message keeps its generic credential sentence rather
  # than inventing a client. See coldops/intelligence/case_studies.py.
  COLDOPS_CASE_STUDIES_PATH: ${COLDOPS_CASE_STUDIES_PATH:-}
  # A one-page summary, linked from the references block. A link and not an
  # attachment: an unsolicited PDF from an unknown sender is a strong spam
  # signal, corporate gateways strip them, and a hosted page produces a click
  # -- which is the engagement signal this system otherwise does not have.
  COLDOPS_ONE_PAGER_URL: ${COLDOPS_ONE_PAGER_URL:-}
  # No cold mail from a mailbox without a recent inbox reading. See
  # coldops.delivery.placement_gate.
  COLDOPS_PLACEMENT_GATE_ENABLED: ${COLDOPS_PLACEMENT_GATE_ENABLED:-false}
  # "brief" for the cold domains: 60-120 words, one link. See Settings.message_form.
  COLDOPS_MESSAGE_FORM: ${COLDOPS_MESSAGE_FORM:-full}
  # The one-page brief, attached to every message. Unset attaches nothing.
  # The file is read at send time from the docs mount below, so regenerating it
  # takes effect without a rebuild.
  COLDOPS_ONE_PAGER_ATTACHMENT_PATH: ${COLDOPS_ONE_PAGER_ATTACHMENT_PATH:-}
  # What share of messages carry it, 0-100. Zero attaches to nothing, which is
  # the shipped default: an attachment is a new signal to receivers, so it goes
  # to a sample first and to everything only once the mailboxes are healthy.
  COLDOPS_ONE_PAGER_SAMPLE_PERCENT: ${COLDOPS_ONE_PAGER_SAMPLE_PERCENT:-0}
  COLDOPS_MODEL_ROUTE_CONTACT: ${COLDOPS_MODEL_ROUTE_CONTACT:-openrouter:nvidia/nemotron-3-super-120b-a12b:free}
  # --- identity ---
  COLDOPS_AUTH_MODE: ${COLDOPS_AUTH_MODE:-local}
  COLDOPS_LOCAL_JWT_SECRET: ${COLDOPS_LOCAL_JWT_SECRET:-dev-only-not-for-production}
  COLDOPS_CLERK_ISSUER_URL: ${COLDOPS_CLERK_ISSUER_URL:-}
  # --- observability ---
  COLDOPS_OTEL_EXPORTER_OTLP_ENDPOINT: ${COLDOPS_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  COLDOPS_OTEL_TRACES_ENABLED: ${COLDOPS_OTEL_TRACES_ENABLED:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan_dev_password}
      POSTGRES_DB: titan
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    command: >
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Temporal keeps its own database. Sharing the application database, as the
  # pre-0.2 compose file did, couples two very different write patterns and
  # makes an application restore also roll back workflow history.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev_password}
      POSTGRES_DB: temporal
    volumes: [temporal_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev_password}
      POSTGRES_SEEDS: temporal-postgres
    ports: ["${TEMPORAL_HOST_PORT:-7233}:7233"]
    depends_on:
      temporal-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # The Web UI is a SEPARATE image. The pre-0.2 compose file published port
  # 8233 on the auto-setup container, which serves gRPC only -- so the UI URL
  # in the old README could never have worked.
  temporal-ui:
    image: temporalio/ui:2.32.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["${TEMPORAL_UI_HOST_PORT:-8233}:8080"]
    depends_on: [temporal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # A capture server: accepts every message and delivers none of them. This is
  # how the real send path -- headers, footers, unsubscribe, the lot -- gets
  # exercised and read before anything reaches a stranger, which is what
  # coldops/delivery/providers/smtp.py was written for.
  #
  # Opt-in, so `docker compose up -d` does not start it by accident:
  #     docker compose --profile rehearsal up -d mailpit
  # Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    profiles: [rehearsal]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *coldops-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *coldops-env
    command: ["uvicorn", "coldops.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${API_HOST_PORT:-8000}:8000"]
    volumes:
      # Read-only, and only here: the API for `coldops mailbox`, the outbox
      # worker to authenticate as each mailbox, the inbound worker to read
      # each one. The browser worker and the web app never see it.
      - ./docs/one-pager:/run/one-pager:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # Registers LeadResearchWorkflow and its activities on the titan-research
  # queue. The pre-0.2 repository defined workflows and registered none of them,
  # so nothing could execute; this service is that missing registration.
  temporal-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *coldops-env
    command: ["python", "-m", "coldops.workers.temporal_worker"]
    volumes:
      # The composer reads case_studies.json from here. This worker is where
      # drafts are written, so it is the one service that needs it -- the mount
      # was on api, outbox-worker and inbound-worker and not on the worker that
      # actually composes.
      - ./secrets:/run/secrets:ro
    healthcheck:
      # The API image's HEALTHCHECK curls :8000; a worker serves no HTTP, so it
      # would be permanently unhealthy and restart-looped. This checks the one
      # dependency the worker genuinely needs.
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['COLDOPS_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # The only service holding an email provider credential.
  outbox-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *coldops-env
    command: ["python", "-m", "coldops.workers.outbox"]
    volumes:
      # Read-only, and only here: the API for `coldops mailbox`, the outbox
      # worker to authenticate as each mailbox, the inbound worker to read
      # each one. The browser worker and the web app never see it.
      - ./docs/one-pager:/run/one-pager:ro
      - ./secrets:/run/secrets:ro
    healthcheck:
      # The API image's HEALTHCHECK curls :8000; a worker serves no HTTP, so it
      # would be permanently unhealthy and restart-looped. This checks the one
      # dependency the worker genuinely needs.
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['COLDOPS_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # Reads the outreach mailbox and feeds replies to the ingest rules. Runs under
  # the same profile as the outbox worker but is a separate process on purpose:
  # this one holds a mailbox password and never sends, that one holds a provider
  # client and never reads. Neither can do the other's job by accident.
  #
  # Reads every mailbox in COLDOPS_MAILBOX_FILE, or the single COLDOPS_IMAP_*
  # mailbox when no pool file is set. With three sending addresses and one
  # poller, two thirds of the bounces and unsubscribe requests looked exactly
  # like silence.
  #
  # Exits zero, saying so, when no mailbox is configured at all.
  inbound-worker:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment: *coldops-env
    command: ["python", "-m", "coldops.workers.inbound"]
    volumes:
      # Read-only, and only here: the API for `coldops mailbox`, the outbox
      # worker to authenticate as each mailbox, the inbound worker to read
      # each one. The browser worker and the web app never see it.
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg;psycopg.connect(os.environ['COLDOPS_DATABASE_URL'].replace('postgresql+psycopg://','postgresql://')).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: on-failure
    # on-failure, not unless-stopped. The worker exits zero when IMAP is
    # not configured, and `unless-stopped` restarts a container whatever
    # its exit code -- which turned a clean 'nothing to do' into a
    # permanent crash loop that made the whole stack look unhealthy.

  # Deliberately receives NO database, email, or model credentials. It is the
  # only service that fetches attacker-controlled URLs, so its blast radius is
  # limited to "can make outbound HTTP requests".
  browser-worker:
    build: {context: apps/browser-worker, dockerfile: Dockerfile}
    environment:
      BROWSER_WORKER_PORT: "8800"
      BROWSER_WORKER_TOKEN: ${COLDOPS_BROWSER_WORKER_TOKEN:-}
      # Sized to the Temporal worker's activity slots. At 2 against 8 slots,
      # six of every eight crawl attempts got an immediate 503, burned their
      # four retries and failed -- 1,819 of 2,005 research runs in one day.
      #
      # 4, and the number is set by what the pipeline needs rather than by what
      # the box can be pushed to. Fifty sends a day needs roughly 150 crawls a
      # day; 4 lanes give about 190 an hour, which is thirty times that.
      #
      # Higher was measured and rejected. 8 lanes looked fine in a 90-second
      # snapshot -- 595% CPU -- and under sustained load sat at 450-850%, which
      # with the outbox worker alongside is most of an 8-core machine. The test
      # suite went from 3 minutes to 68 and 345 database tests skipped because
      # the test postgres could not be reached. Buying 30x headroom we have no
      # use for, at the price of the machine, is not a trade worth making.
      BROWSER_WORKER_CONCURRENCY: ${BROWSER_WORKER_CONCURRENCY:-4}
    ports: ["${BROWSER_WORKER_HOST_PORT:-8800}:8800"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8800/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: [no-new-privileges:true]
    # Chromium needs more than the 64MB default shared memory segment.
    shm_size: 1gb
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Passed as a build argument, not only as an environment variable:
      # NEXT_PUBLIC_* is compiled into the browser bundle, so a runtime value
      # is never seen by the page that needs it. Defaults to the API's own host
      # port so the two cannot drift -- they had, and the dashboard called 8000
      # while the API listened on 8010.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8000}}
    environment:
      # Kept for server-side rendering, which reads it at runtime. Origin only:
      # the client appends /api/v1 itself.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8000}}
      NODE_ENV: production
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_data:
  redis_data:
