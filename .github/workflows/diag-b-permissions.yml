# TEMPORARY diagnostic. Delete once CI starts again.
#
# Variable under test: the GITHUB_TOKEN permission escalation, isolated.
#
# Identical to diag-a except for the permissions block. ci.yml asks for
# `packages: write` while the repository default is `read`; if GitHub refuses
# that escalation it rejects the whole workflow at startup rather than failing
# the job, which produces exactly the 0s no-jobs run we are seeing.
#
# diag-a passing and diag-b failing isolates it to this block. Both passing
# clears permissions entirely and points at the action allowlist.
name: diag-b-permissions

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "diag-b started - packages:write was granted"
