name: TITAN Master CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Python Backend Setup ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        
      - name: Install Python Dependencies
        working-directory: ./apps/api
        run: uv pip install --system -e .[dev]

      # --- Next.js Frontend Setup ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pre-commit checks
        run: |
          # Auto-fix all issues
          ruff check apps/api --fix || true
          black apps/api || true
          pnpm -C apps/web run lint --fix || true
          
          # Verify no errors remain
          ruff check apps/api
          black --check apps/api
          pnpm -C apps/web run lint

      - name: Python Type Check (Mypy)
        working-directory: ./apps/api
        run: mypy app/

      - name: Run Python Tests
        working-directory: ./apps/api
        run: pytest tests/
        
      - name: Test coverage guard
        working-directory: ./apps/api
        run: |
          # Require 80%+ coverage
          coverage run -m pytest tests/
          coverage report --show-missing
          if [ $(coverage report -m | grep -c "MISSING") -gt 20 ]; then
            echo "❌ Test coverage too low"
            exit 1
          fi

      - name: Frontend Linter (ESLint)
        working-directory: ./apps/web
        run: pnpm lint

      - name: Frontend Type Check (TypeScript)
        working-directory: ./apps/web
        run: pnpm tsc --noEmit

  build-and-push:
    name: Build & Push Images
    needs: lint-and-test
    # Only run on main branch after tests pass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata (tags, labels) for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy-to-production:
    name: Deploy to Production
    needs: build-and-push
    # Only deploy from main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        # Ignore failure if secrets aren't set up yet for local dev
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/titan
            # Pull the latest images from GHCR
            docker-compose pull
            # Restart services with the new images, dropping orphans
            docker-compose up -d --remove-orphans
