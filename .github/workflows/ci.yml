# Titan-OS CI.
#
# Replaces the pre-0.2 pipeline, which suffixed ruff, black, mypy, pytest and
# coverage with `|| true` -- so the job was green whether or not the code
# compiled (gap analysis C-11). Nothing here swallows a failure.
#
# Actions are pinned to commit SHAs: a tag is mutable, and a compromised action
# is a supply-chain path straight into a workflow that holds registry
# credentials.

name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}

      # Run gitleaks from its published image rather than the marketplace
      # action.
      #
      # Settings -> Actions -> General -> "Allow select actions" permits
      # GitHub-owned and Marketplace-verified actions only, and gitleaks is
      # neither. An action outside the allowlist does not fail its own step --
      # GitHub refuses the entire workflow at startup, producing a 0s run with
      # no jobs, no logs and no relationship to the commit. Every run on every
      # branch went red that way, including main.
      #
      # Docker is preinstalled on ubuntu-latest, so this needs no action at
      # all and cannot be broken by that setting again.
      - name: gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --verbose

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: titan_dev_password
          POSTGRES_DB: titan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U titan" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TITAN_ENVIRONMENT: test
      TITAN_DATABASE_URL: postgresql+psycopg://titan:titan_dev_password@localhost:5432/titan
      TITAN_TEST_DATABASE_URL: postgresql+psycopg://titan:titan_dev_password@localhost:5432/titan
    defaults:
      run: {working-directory: apps/api}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}

      - name: Install
        run: uv pip install --system -e ".[dev]"

      # No `|| true` on any step below. A failure fails the build.
      - name: Lint
        run: ruff check titan tests

      - name: Format check
        run: ruff format --check titan tests

      - name: Type check
        run: mypy titan

      - name: Migrate from an empty database
        run: alembic upgrade head

      - name: Migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Schema drift check
        run: alembic check

      - name: Tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report --show-missing

      # The safety-critical modules must stay near-fully covered; a drop here
      # means a guard lost its test.
      - name: Coverage floor on safety-critical modules
        run: |
          coverage report --fail-under=90 \
            --include="titan/policy/*,titan/delivery/quotas.py,titan/delivery/suppression.py,titan/security/url_guard.py,titan/intelligence/message_validator.py"

      - name: Generated .env.example is current
        run: |
          python -m titan.cli env-example -o /tmp/env.generated
          diff -u ../../.env.example /tmp/env.generated

      # Audits the resolved dependency set rather than the installed
      # environment. Auditing the environment means auditing `titan-os` itself,
      # which is installed with `-e` and is not on PyPI: --strict then fails on
      # the project, and --skip-editable turns that into a *skip*, which
      # --strict also fails on.
      #
      # --strict is kept, and there is no `|| pip-audit` fallback. The previous
      # fallback re-ran the same audit without --strict, so a genuine
      # resolution failure ended green -- a step that cannot fail is not an
      # audit.
      - name: Dependency audit
        run: |
          uv pip install --system pip-audit
          uv pip compile pyproject.toml --extra dev -o /tmp/titan-requirements.txt
          pip-audit --strict -r /tmp/titan-requirements.txt             --ignore-vuln GHSA-4xh5-x5gv-qwph

  browser-worker:
    name: Browser worker
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/browser-worker}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: {node-version: "20"}
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Unit tests (URL guard)
        run: npx tsx --test test/urlGuard.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fixture sites + crawl tests
        env:
          TITAN_UNSAFE_ALLOW_LOOPBACK: "1"
          TITAN_FIXTURE_PORT: "8899"
        run: |
          npx tsx fixtures/server.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8899/health && break
            sleep 1
          done
          npx tsx --test test/crawl.test.ts

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: {node-version: "20"}
      # corepack rather than pnpm/action-setup.
      #
      # This repository's Actions allowlist (Settings -> Actions -> General,
      # "Allow select actions") permits GitHub-owned and Marketplace-verified
      # actions only, and pnpm is not a verified creator. Referencing it did
      # not fail its own step -- GitHub rejected the whole workflow at startup,
      # producing a 0s run with no jobs and no logs, on every branch and on
      # main. Isolated by probing each action in its own workflow: checkout,
      # setup-uv and docker/* all start; pnpm/action-setup alone does not.
      #
      # corepack ships inside Node and reads the pinned version from the same
      # packageManager field the action was reading, so the pin is unchanged.
      - name: Enable pnpm from the packageManager pin
        env: {COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"}
        run: corepack enable
      # Frozen. A lockfile that CI is allowed to ignore is not a lockfile;
      # this used to be --no-frozen-lockfile because the browser worker (an
      # npm project) was in the pnpm workspace and its entries went stale.
      # Vercel reads packageManager from the Root Directory (apps/web), not
      # from the repository root, and silently falls back to pnpm 8 without it
      # -- which cannot read a lockfileVersion 9 lockfile. Both must agree.
      - name: packageManager is pinned identically in root and apps/web
        working-directory: .
        run: |
          root=$(node -p "require('./package.json').packageManager")
          web=$(node -p "require('./apps/web/package.json').packageManager")
          if [ "$root" != "$web" ]; then
            echo "::error::packageManager differs: root=$root apps/web=$web"
            exit 1
          fi
          echo "packageManager pinned at $root in both"

      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . --max-warnings 0
      - name: Type check
        run: pnpm exec tsc --noEmit

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Assert production sending is off by default
        run: |
          # A change that flips the kill switch on in a committed config must
          # fail the build, not reach a reviewer's judgement.
          if docker compose config | grep -qiE 'TITAN_PRODUCTION_SENDING_ENABLED:\s*"?true'; then
            echo "::error::compose enables production sending by default"
            exit 1
          fi
      - name: Assert the loopback escape hatch is not enabled
        run: |
          if docker compose config | grep -q 'TITAN_UNSAFE_ALLOW_LOOPBACK'; then
            echo "::error::compose enables the SSRF loopback test hatch"
            exit 1
          fi

  # NOTE ON THE BUILD FAILURES ON main (runs up to 2026-08-04)
  #
  # The image built fine every time. Publishing it did not:
  #
  #   failed to push ghcr.io/<owner>/titan-api:sha-<sha>
  #   HEAD .../blobs/sha256:... -> 403 Forbidden
  #
  # The cause is a repository setting, not this file: Settings -> Actions ->
  # General -> Workflow permissions is "Read repository contents permission".
  #
  # An earlier revision of this comment added that "a workflow cannot grant
  # itself more than the repository default allows". That is wrong, and it was
  # asserted without being tested. A probe workflow requesting
  # `packages: write` against this repository, whose default is read, starts
  # and is granted it: the repository setting is a default for workflows that
  # declare no `permissions:` block, not a ceiling on those that do.
  #
  # So the top-level `permissions: packages: write` should be sufficient on its
  # own, and the 403 above has some other cause. Left unresolved rather than
  # guessed at a third time -- the next push to main will say.
  #
  # This is why the failure looked intermittent and tree-independent: images are
  # only pushed from main (see `push:` below), so every branch and pull-request
  # run passes regardless. A green PR does not prove main will build.
  build:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [python, browser-worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # Push only from the default branch of this repository. A pull request
      # from a fork must never be able to publish an image under our name, and
      # `github.event_name` is the only thing that distinguishes them.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: apps/api/Dockerfile
          # Loaded locally on every run so the assertions below still execute
          # on a pull request, where nothing is pushed.
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Immutable digest-pinned tag plus a moving one. Deployments pin
          # sha-<commit>; `latest` is for convenience only and must not be what
          # a production compose references.
          tags: |
            ghcr.io/${{ github.repository_owner }}/titan-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/titan-api:latest
          # Scoped per image so the two builds cannot overwrite each other's
          # cache manifests. Hygiene, not a bug fix -- see the note on this job
          # about what actually broke the build on main.
          cache-from: type=gha,scope=titan-api
          cache-to: type=gha,mode=max,scope=titan-api

      - name: Build browser worker image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: apps/browser-worker
          file: apps/browser-worker/Dockerfile
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/titan-browser-worker:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/titan-browser-worker:latest
          cache-from: type=gha,scope=titan-browser-worker
          cache-to: type=gha,mode=max,scope=titan-browser-worker

      # buildx pushes every tag it is given, and a bare `titan-api:ci` resolves
      # to docker.io/library/titan-api -- a repository this project has no
      # rights to and no reason to want. On a pull request nothing is pushed so
      # the bare tag was harmless; on main it took the whole job down *after*
      # the GHCR push had already succeeded, which is why the failure looked
      # like a registry permission problem twice over.
      #
      # `load: true` puts the built image in the local daemon under its GHCR
      # names, so aliasing here gives the assertions a stable short name without
      # adding a push target.
      - name: Tag images for local assertions
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/titan-api:latest titan-api:ci
          docker tag ghcr.io/${{ github.repository_owner }}/titan-browser-worker:latest titan-browser-worker:ci

      - name: API image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id titan-api:ci -u)
          if [ "$uid" = "0" ]; then
            echo "::error::API image runs as root"
            exit 1
          fi
          echo "API image uid=$uid"

      - name: Browser worker image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id titan-browser-worker:ci -u)
          if [ "$uid" = "0" ]; then
            echo "::error::browser worker image runs as root"
            exit 1
          fi
          echo "browser worker uid=$uid"

      # The compiler is a build-time tool. Finding it in the runtime image
      # means the two-stage build has collapsed back into one.
      - name: Browser worker image ships no compiler
        run: |
          if docker run --rm --entrypoint sh titan-browser-worker:ci                -c "test -d node_modules/typescript"; then
            echo "::error::typescript is present in the runtime image"
            exit 1
          fi
          echo "runtime image contains no compiler"
