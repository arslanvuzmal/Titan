name: TITAN CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Python Backend Setup ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        
      - name: Install Python Dependencies
        working-directory: ./apps/api
        run: uv pip install --system -e .[dev]

      # --- Next.js Frontend Setup ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-commit checks
        run: |
          # Auto-fix all issues
          ruff check apps/api --fix || true
          black apps/api || true
          pnpm -C apps/web run lint --fix || true
          
          # Verify no errors remain
          ruff check apps/api
          black --check apps/api
          pnpm -C apps/web run lint

      - name: Python Type Check (Mypy)
        working-directory: ./apps/api
        run: mypy app/

      - name: Run Python Tests
        working-directory: ./apps/api
        run: pytest tests/
        
      - name: Test coverage guard
        working-directory: ./apps/api
        run: |
          # Require 80%+ coverage
          coverage run -m pytest tests/
          coverage report --show-missing
          if [ $(coverage report -m | grep -c "MISSING") -gt 20 ]; then
            echo "❌ Test coverage too low"
            exit 1
          fi

      - name: Frontend Linter (ESLint)
        working-directory: ./apps/web
        run: pnpm lint

      - name: Frontend Type Check (TypeScript)
        working-directory: ./apps/web
        run: pnpm tsc --noEmit
